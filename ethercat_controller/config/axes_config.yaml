# 伺服轴配置文件
# brand: 驱动器品牌 (HUICHUAN/LEISAI)
# name: 轴名称 (ROS2通信标识, 不可重复)
# display_name: 轴显示名称 (HMI界面显示用, 不提供则默认使用name)
# position: EtherCAT 从站位置 (从0开始)
# axis_type: 轴类型 (AXIS1/AXIS2), 双轴驱动器的第1轴或第2轴
# product_code: 产品编码 (0表示使用品牌默认值; 汇川: 0x000c0112或0x000c010d; 雷赛: 0x0000a400/0x00002700/0x0000a500)
# gear_ratio: 减速比
# calc_mode: 计算模式 (ANGLE=角度模式, DISPLACEMENT=位移模式)
# jog_speed: 点动速度 (角度轴单位: °/s, 位移轴单位: mm/s)
# min_jog_speed: 最小点动速度 (角度轴: °/s, 位移轴: mm/s, 不提供则默认1.0)
# max_jog_speed: 最大点动速度 (角度轴: °/s, 位移轴: mm/s, 不提供则默认200.0)
# auto_speed: 自动模式移动速度 (角度轴: °/s, 位移轴: mm/s, 不提供则默认5.0)

servo_axes:
  - brand: "HUICHUAN"
    name: "axis1"
    display_name: "龙门x"
    position: 0
    axis_type: "AXIS1"
    product_code: 0x000c0112
    gear_ratio: 1.0
    calc_mode: "DISPLACEMENT"
    jog_speed: 30.0
    min_jog_speed: 1.0
    max_jog_speed: 100.0
    auto_speed: 60.0

  - brand: "HUICHUAN"
    name: "axis2"
    display_name: "龙门y"
    position: 1
    axis_type: "AXIS1"
    product_code: 0x000c0112
    gear_ratio: 1.0
    calc_mode: "DISPLACEMENT"
    # 回原轴：复位按钮按下时该轴切换为 HM 回原模式，其余情况为 CSP
    operation_mode: "homing"
    jog_speed: 20.0
    min_jog_speed: 1.0
    max_jog_speed: 100.0
    auto_speed: 40.0

  - brand: "HUICHUAN"
    name: "axis3"
    display_name: "龙门z"
    position: 2
    axis_type: "AXIS1"
    product_code: 0x000c0112
    gear_ratio: 1.0
    calc_mode: "DISPLACEMENT"
    jog_speed: 10.0
    min_jog_speed: 1.0
    max_jog_speed: 100.0
    auto_speed: 20.0

  - brand: "HUICHUAN"
    name: "axis4"
    display_name: "侧面x"
    position: 3
    axis_type: "AXIS1"
    product_code: 0x000c0112
    gear_ratio: 1.0
    calc_mode: "DISPLACEMENT"
    jog_speed: 30.0
    min_jog_speed: 1.0
    max_jog_speed: 100.0
    auto_speed: 60.0

  - brand: "HUICHUAN"
    name: "axis5"
    display_name: "侧面y"
    position: 4
    axis_type: "AXIS1"
    product_code: 0x000c0112
    gear_ratio: 1.0
    calc_mode: "DISPLACEMENT"
    jog_speed: 30.0
    min_jog_speed: 1.0
    max_jog_speed: 100.0
    auto_speed: 60.0

  - brand: "HUICHUAN"
    name: "axis6"
    display_name: "旋转台"
    position: 5
    axis_type: "AXIS1"
    product_code: 0x000c0112
    gear_ratio: 30.0
    calc_mode: "ANGLE"
    jog_speed: 10.0
    min_jog_speed: 1.0
    max_jog_speed: 100.0
    auto_speed: 20.0
    # 自动模式梯形速度曲线（旋转台专用：比线性轴更柔和，减小回转冲击与线缆牵扯）
    # 200 °/s² 换算为 0.6 脉冲/周期²，各速度下斜坡时间：
    #   工作速度 20 °/s(auto_speed) → 0.10s (100 周期)，加减速距离各 1.0°
    #   30% 速度 30 °/s            → 0.15s，加减速距离各 2.25°
    #   满速   100 °/s(max_jog)    → 0.50s，加减速距离各 25°
    # 现场如需调整：把 accel/decel 同比例放大/缩小即可（如都填 400.0 即等于系统默认值）
    accel: 200.0
    decel: 200.0
    # 角度软限位（仅角度模式轴有效，单位：度）
    # 目标角度超出此范围时自动钳制，可防止机械碰撞或线缆缠绕
    min_angle: -1200.0
    max_angle: 1200.0

